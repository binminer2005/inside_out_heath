{% extends "base.html" %}
{% block title %}Quên mật khẩu{% endblock %}
{% block content %}
<div class="auth-wrapper"><div class="auth-card">
  <h1>Quên mật khẩu?</h1>
  <p class="subtitle">Nhập email tài khoản. Nếu email tồn tại, hướng dẫn đặt lại sẽ được gửi đến bạn.</p>
  <form method="post">
    <div class="form-group"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email" placeholder="you@email.com"></div>
    <button class="btn btn-primary btn-block" type="submit">Gửi hướng dẫn đặt lại</button>
  </form>
  <p class="auth-footer"><a href="{{ url_for('login') }}">Quay lại đăng nhập</a></p>
</div></div>
{% endblock %}
