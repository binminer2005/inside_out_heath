{% extends "base.html" %}
{% block title %}Tạo mật khẩu mới{% endblock %}
{% block content %}
<div class="auth-wrapper"><div class="auth-card">
  <h1>Tạo mật khẩu mới</h1>
  <p class="subtitle">Liên kết đặt lại có hiệu lực trong 30 phút.</p>
  <form method="post">
    <div class="form-group"><label for="password">Mật khẩu mới</label><input id="password" name="password" type="password" minlength="8" required autocomplete="new-password"></div>
    <div class="form-group"><label for="password_confirmation">Nhập lại mật khẩu</label><input id="password_confirmation" name="password_confirmation" type="password" minlength="8" required autocomplete="new-password"></div>
    <button class="btn btn-primary btn-block" type="submit">Lưu mật khẩu mới</button>
  </form>
</div></div>
{% endblock %}
